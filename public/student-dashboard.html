<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        header {
            background: #1d4e89;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .dashboard {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .welcome {
            font-size: 28px;
            color: #1d4e89;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            flex: 1;
            min-width: 200px;
            padding: 25px;
            background: #f1f5f9;
            border-radius: 10px;
            text-align: center;
        }

        .logout {
            margin-top: 30px;
            padding: 12px 25px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout:hover {
            background: #c9302c;
        }
    </style>
</head>

<body>

    <header>
        <h1>Government Polytechnic Kalaburagi</h1>
        <p>Student Dashboard</p>
    </header>

    <div class="dashboard">

        <h2 class="welcome">
            Welcome, <span id="studentName"></span>!
        </h2>

        <p>
            Username:
            <strong id="studentUsername"></strong>
        </p>

        <div class="cards">

            <div class="card">
                <h3>📚 Courses</h3>
                <p>View your courses</p>
            </div>

            <div class="card">
                <h3>📝 Results</h3>
                <p>Check your results</p>
            </div>

            <div class="card">
                <h3>📅 Attendance</h3>
                <p>View attendance</p>
            </div>

            <div class="card">
                <h3>📢 Notices</h3>
                <p>College announcements</p>
            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

    <script>

        const name = localStorage.getItem("studentName");
        const username = localStorage.getItem("studentUsername");

        if (!name || !username) {

            window.location.href = "index.html";

        } else {

            document.getElementById("studentName").textContent = name;

            document.getElementById("studentUsername").textContent = username;
        }

        function logout() {

            localStorage.removeItem("studentName");
            localStorage.removeItem("studentUsername");

            window.location.href = "index.html";
        }

    </script>

</body>
</html>
